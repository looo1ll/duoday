<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наш уголок</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2b3445;--mute:#7a8396;--line:#ebe4d6;--blue:#8ec5f2;--blue2:#dcedfb;--peach:#ffe2d4;--mint:#d6f0e4;--lav:#e6def8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151b29;--card:#1f2638;--ink:#eef1f8;--mute:#9aa4ba;--line:#2c3550;--blue:#6fb0e6;--blue2:#27405c;--peach:#4a3b3a;--mint:#294640;--lav:#38335a}}
:root[data-theme="dark"]{--bg:#151b29;--card:#1f2638;--ink:#eef1f8;--mute:#9aa4ba;--line:#2c3550;--blue:#6fb0e6;--blue2:#27405c;--peach:#4a3b3a;--mint:#294640;--lav:#38335a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:500}
#app{max-width:480px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:26px;font-weight:800;margin:4px 0 14px;letter-spacing:-.3px}
h2{font-size:17px;font-weight:800;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:var(--blue2);border-radius:18px;padding:10px 14px;font-weight:700;transition:transform .15s}
button:disabled{opacity:.45;cursor:default}button:active{transform:scale(.94)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 12px;width:100%}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fix{flex:0 0 auto}
.room{border-radius:32px;padding:14px 14px 18px;background:linear-gradient(180deg,var(--blue2) 0%,var(--blue2) 62%,var(--peach) 62%);position:relative;overflow:hidden;text-align:center}
.stats{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;gap:10px}
.bar{flex:1;height:10px;border-radius:9px;background:var(--card);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .5s}
.pet{width:200px;height:200px;margin:4px auto 0;display:block;animation:float 3.2s ease-in-out infinite}
.pet.go{animation:hop .6s ease 2}
.eyes{transform-origin:100px 100px;animation:blink 4.5s infinite}
.sleepy .eyes{display:none}.open .z{display:none}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes hop{40%{transform:translateY(-26px) rotate(-4deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px)}}
.fx{position:absolute;left:50%;top:40%;font-size:30px;animation:rise 1.6s ease forwards}
.bubble{display:inline-block;background:var(--card);border-radius:18px;padding:8px 14px;font-weight:700;font-size:14px;margin:2px 0 6px}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.acts button{display:flex;flex-direction:column;gap:2px;padding:8px 2px;font-size:11px;background:var(--card)}.acts span{font-size:22px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.me{display:flex;align-items:center;gap:10px}.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:0;padding:0;flex:0 0 46px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chips button{flex:0 0 auto;background:var(--card);border:1px solid var(--line)}.chips .on{background:var(--blue);color:#13263a}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.item.done .t{text-decoration:line-through;color:var(--mute)}.t{flex:1}
.chk{width:28px;height:28px;border-radius:50%;padding:0;background:var(--bg);border:2px solid var(--blue);flex:0 0 28px}.done .chk{background:var(--blue)}
.x{background:none;color:var(--mute);padding:4px 8px}
.idea{font-size:20px;font-weight:800;line-height:1.3;text-align:center;padding:22px 10px;background:var(--lav);border-radius:24px;margin:12px 0}
.code{letter-spacing:3px;font-weight:800;font-size:22px}.muted{color:var(--mute);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav div{pointer-events:auto;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:6px;width:100%;max-width:456px}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:7px 2px;border-radius:24px}nav button span{font-size:21px}nav .on{background:var(--blue2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

<script>
const SB_URL='https://jgpiatfzeaosfitgqvlr.supabase.co',SB_KEY='sb_publishable_4oYZx2oP9xYxp4rAnxlISw_e6K8EAyK',BOT='DuoDayApp_bot';
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const tg=window.Telegram&&Telegram.WebApp;
const PET={name:'Тоши',body:'#8ec5f2',belly:'#e4f3fd',ear:'#ffc3bb'};
const NAMES={a:'Аня',b:'Макс'},MOODS=['😊','🥰','😴','🤩','🥺','😤'];
const ACT=[['feed','🍓','Кормить','Ням-ням! Очень вкусно'],['play','🎾','Играть','Ура, давай ещё!'],['pet','🤍','Гладить','Мурр… так приятно'],['bath','🫧','Купать','Пузырики! Хихи'],['sleep','🌙','Спать','Zzz… спокойной ночи']];
const Q=['Какой момент этой недели ты хочешь запомнить?','Что тебя недавно рассмешило?','Куда бы ты поехал(а) завтра, если бы можно было всё?','Какая мелочь делает твой день лучше?','За что ты сегодня благодарен(на)?','Какую привычку мы могли бы завести вдвоём?'];
const IDEAS={home:[['Устроить киновечер с попкорном',0],['Приготовить новое блюдо вместе',1],['Построить крепость из подушек',0],['Викторина друг про друга',0],['Нарисовать друг друга за 1 минуту',0],['Домашняя пицца с любимыми начинками',1]],out:[['Прогулка до заката',0],['Поехать на велосипедах',0],['Пикник в парке',1],['Фотопрогулка по незнакомому району',0],['Кофе навынос и скамейка у воды',1]],venue:[['Десерт в новой кофейне',1],['Ужин в кафе с кухней, которую не пробовали',2],['Кино на большом экране',2],['Боулинг или бильярд',2],['Выставка или музей',2],['Каток или скалодром',2]],trip:[['Однодневная поездка на электричке',1],['Выходные в соседнем городе',2],['Выбрать точку на карте наугад и поехать',1],['Поход с палаткой',1],['Ночь в загородном домике',2]]};
const SH=[
{id:'bow',n:'Бантик',e:'🎀',slot:'neck',c:20,lvl:1,svg:'<g fill="#ff8fab"><path d="M100 160L80 150V172Z"/><path d="M100 160L120 150V172Z"/><circle cx="100" cy="160" r="6"/></g>'},
{id:'glasses',n:'Очки',e:'🕶️',slot:'face',c:30,lvl:2,svg:'<g fill="none" stroke="#22304a" stroke-width="4"><circle cx="78" cy="100" r="15"/><circle cx="122" cy="100" r="15"/><path d="M93 100H107"/></g>'},
{id:'cap',n:'Кепка',e:'🧢',slot:'head',c:50,lvl:2,svg:'<path d="M56 72Q100 18 144 72Z" fill="#ff8a65"/><path d="M128 68Q170 64 170 78L126 78Z" fill="#f4623a"/>'},
{id:'scarf',n:'Шарф',e:'🧣',slot:'neck',c:60,lvl:3,svg:'<path d="M46 142Q100 174 154 142V156Q100 190 46 156Z" fill="#f4a261"/><path d="M124 160L140 192L120 190Z" fill="#e58b3f"/>'},
{id:'crown',n:'Корона',e:'👑',slot:'head',st:25,lvl:1,svg:'<path d="M70 64L76 36L90 52L100 30L110 52L124 36L130 64Z" fill="#ffd54a" stroke="#e0a800" stroke-width="3" stroke-linejoin="round"/>'},
{id:'cape',n:'Звёздный плащ',e:'🦸',slot:'back',st:40,lvl:3,svg:'<path d="M48 108Q16 192 62 190H138Q184 192 152 108Z" fill="#7c6fe0"/><circle cx="40" cy="160" r="3" fill="#ffe27a"/><circle cx="160" cy="150" r="3" fill="#ffe27a"/>'}];
const worn=sl=>SH.filter(i=>S.wear.includes(i.id)&&i.slot===sl).map(i=>i.svg).join('');

let sb,me,SP,MEM=[],E=[],S={coins:0,xp:0,lvl:1,own:[],wear:[]},screen='load',err='',kind='couple',tab='home',seg='todo',cat='home',bud=2,idea=null,ps='',bubble='Привет! Я рад тебя видеть 💙',note='';
const mine=()=>MEM.find(m=>m.user_id===me.id),other=()=>MEM.find(m=>m.user_id!==me.id);
const uname=u=>(MEM.find(m=>m.user_id===u)||{}).name||'?',col=u=>u===me.id?'peach':'mint';
const ent=k=>E.filter(x=>x.kind===k);
const today=()=>new Date().toISOString().slice(0,10);
function fail(e){const m=String((e&&e.message)||e),M={'code not found':'Код не найден. Проверьте его и попробуйте ещё раз.','space is full':'В этом пространстве уже двое.','already in a space':'Вы уже в пространстве.','already in another space':'Вы уже в другом пространстве.'};const t=M[m]||'Ошибка: '+m;tg&&tg.showAlert?tg.showAlert(t):alert(t)}
const save=()=>{sb.from('spaces').update({state:S}).eq('id',SP.id).then(r=>{if(r.error)fail(r.error)})};

async function boot(){
 try{
  if(!tg||!tg.initData){screen='nots';return render()}
  tg.ready();tg.expand();render();
  const r=await fetch(SB_URL+'/functions/v1/tg-auth',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify({initData:tg.initData})});
  const j=await r.json();if(!r.ok)throw new Error('вход: '+(j.error||r.status));
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:true}});
  const a=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});if(a.error)throw a.error;
  me={id:a.data.user.id,name:j.name||''};
  const m=await sb.from('members').select('space_id').eq('user_id',me.id).maybeSingle();if(m.error)throw m.error;
  if(!m.data){screen='onb';return render()}
  await fetchAll(m.data.space_id);subscribe();screen='app';render();
 }catch(e){screen='err';err=String((e&&e.message)||e);render()}
}
async function fetchAll(id){
 const [s,mm,e]=await Promise.all([sb.from('spaces').select('*').eq('id',id).single(),sb.from('members').select('*').eq('space_id',id),sb.from('entries').select('*').eq('space_id',id).order('created_at')]);
 if(s.error)throw s.error;if(mm.error)throw mm.error;if(e.error)throw e.error;
 SP=s.data;S=Object.assign({coins:0,xp:0,lvl:1,own:[],wear:[]},SP.state);MEM=mm.data;E=e.data;
}
let t0;function soon(){clearTimeout(t0);t0=setTimeout(async()=>{try{await fetchAll(SP.id);const a=document.activeElement;if(!a||!/INPUT|TEXTAREA/.test(a.tagName))render()}catch(e){}},300)}
function subscribe(){
 sb.channel('sp').on('postgres_changes',{event:'*',schema:'public',table:'entries'},soon)
  .on('postgres_changes',{event:'*',schema:'public',table:'members',filter:'space_id=eq.'+SP.id},soon)
  .on('postgres_changes',{event:'*',schema:'public',table:'spaces',filter:'id=eq.'+SP.id},soon).subscribe();
 setInterval(soon,20000);
}
async function afterJoin(){try{const m=await sb.from('members').select('space_id').eq('user_id',me.id).maybeSingle();await fetchAll(m.data.space_id);subscribe();screen='app';render()}catch(e){fail(e)}}
async function create(){const r=await sb.rpc('create_space',{p_kind:kind,p_name:$('#nm').value.trim()||'Я'});if(r.error)return fail(r.error);afterJoin()}
async function join(c){const r=await sb.rpc('join_space',{p_code:c||$('#cd').value,p_name:$('#nm').value.trim()||'Я'});if(r.error)return fail(r.error);afterJoin()}
async function addE(k,data){const r=await sb.from('entries').insert({space_id:SP.id,kind:k,data});if(r.error)return fail(r.error);await fetchAll(SP.id);render()}
async function updE(id,data){const r=await sb.from('entries').update({data,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return fail(r.error);await fetchAll(SP.id);render()}
async function delE(id){const r=await sb.from('entries').delete().eq('id',id);if(r.error)return fail(r.error);await fetchAll(SP.id);render()}
function share(){const l=`https://t.me/${BOT}?startapp=${SP.code}`;tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(l)+'&text='+encodeURIComponent('Присоединяйся к нашему уголку 💙 Код: '+SP.code))}

function act(k){const a=ACT.find(x=>x[0]===k);ps=k;bubble=a[3];S.coins+=2;S.xp+=10;
 if(S.xp>=100){S.xp-=100;S.lvl++;bubble='Новый уровень: '+S.lvl+'! 🎉'}
 save();render();setTimeout(()=>{if(ps===k){ps='';render()}},k==='sleep'?4000:1800)}
function pet(){return `<svg class="pet ${ps&&ps!=='sleep'?'go':''} ${ps==='sleep'?'sleepy':'open'}" viewBox="0 0 200 200" role="img" aria-label="${PET.name}">
<g fill="${PET.body}"><ellipse cx="46" cy="64" rx="17" ry="40" transform="rotate(-25 46 64)"/><ellipse cx="154" cy="64" rx="17" ry="40" transform="rotate(25 154 64)"/></g>
<g fill="${PET.ear}"><ellipse cx="47" cy="66" rx="8" ry="26" transform="rotate(-25 47 66)"/><ellipse cx="153" cy="66" rx="8" ry="26" transform="rotate(25 153 66)"/></g>
${worn('back')}<ellipse cx="62" cy="178" rx="20" ry="10" fill="${PET.body}"/><ellipse cx="138" cy="178" rx="20" ry="10" fill="${PET.body}"/>
<ellipse cx="100" cy="118" rx="64" ry="60" fill="${PET.body}"/><ellipse cx="100" cy="138" rx="36" ry="32" fill="${PET.belly}"/>
<ellipse cx="64" cy="122" rx="10" ry="6" fill="${PET.ear}" opacity=".7"/><ellipse cx="136" cy="122" rx="10" ry="6" fill="${PET.ear}" opacity=".7"/>
<g class="eyes" fill="#22304a"><circle cx="78" cy="100" r="9"/><circle cx="122" cy="100" r="9"/><circle cx="81" cy="97" r="3" fill="#fff"/><circle cx="125" cy="97" r="3" fill="#fff"/></g>
<g class="z" fill="none" stroke="#22304a" stroke-width="4" stroke-linecap="round"><path d="M69 102 Q78 109 87 102"/><path d="M113 102 Q122 109 131 102"/></g>
<path d="M88 118 Q100 130 112 118" fill="none" stroke="#22304a" stroke-width="4" stroke-linecap="round"/>${worn('neck')}${worn('face')}${worn('head')}</svg>`}

function pick(){const l=IDEAS[cat].filter(x=>bud===2||x[1]<=bud);idea=l[Math.floor(Math.random()*l.length)][0];render()}
function ideas(){const C={home:'🏠 Дома',out:'🌳 Вне дома',venue:'🍽️ В заведениях',trip:'🧳 Путешествия'},B=[[0,'Бесплатно'],[1,'Недорого'],[2,'Любой бюджет']];
 return `<h1>Чем заняться?</h1><div class="chips">${Object.keys(C).map(k=>`<button class="${cat===k?'on':''}" onclick="cat='${k}';idea=null;render()">${C[k]}</button>`).join('')}</div>
 <div class="chips" style="margin-top:8px">${B.map(b=>`<button class="${bud===b[0]?'on':''}" onclick="bud=${b[0]};idea=null;render()">${b[1]}</button>`).join('')}</div>
 <div class="idea">${idea?esc(idea):'Нажмите кнопку, и мы подберём идею'}</div><button style="width:100%;background:var(--blue)" onclick="pick()">Предложить идею</button>`}


function onb(){const sp=(tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'',K=[['couple','💞 Пара'],['friends','🤝 Друзья'],['custom','✨ Свой вариант']];
 return `<h1>Добро пожаловать 💙</h1><div class="card"><b>Как вас зовут?</b><input id="nm" value="${esc(me.name)}" style="margin-top:8px">
 ${sp?`<p>Вас пригласили в общее пространство.</p><button style="width:100%;background:var(--blue)" onclick="join('${esc(sp)}')">Присоединиться</button>`
 :`<h2>Какое у вас пространство?</h2><div class="chips">${K.map(k=>`<button class="${kind===k[0]?'on':''}" onclick="kind='${k[0]}';render()">${k[1]}</button>`).join('')}</div>
 <button style="width:100%;margin-top:12px;background:var(--blue)" onclick="create()">Создать пространство</button>
 <h2>Или введите код приглашения</h2><div class="row"><input id="cd" placeholder="Код" style="text-transform:uppercase"><button class="fix" onclick="join()">Войти</button></div>`}</div>`}

function home(){const a=mine(),b=other(),day=today(),q=Q[Math.floor(Date.now()/864e5)%Q.length],
 my=E.find(x=>x.kind==='answer'&&x.created_by===me.id&&x.data.day===day),th=E.find(x=>x.kind==='answer'&&x.created_by!==me.id&&x.data.day===day),
 nx=ent('event').map(x=>x.data).filter(x=>x.d>=day).sort((x,y)=>x.d>y.d?1:-1)[0],
 pc=(m,own)=>m?`<div class="card me"><button class="av" style="background:var(--${col(m.user_id)});opacity:1" ${own?'onclick="mood()" aria-label="Сменить настроение"':'disabled'}>${m.mood}</button><div><b>${esc(m.name)}</b><div class="muted">настроение</div></div></div>`:`<div class="card me"><div class="av" style="background:var(--lav)">⏳</div><div><b>Ждём…</b><div class="muted">второго человека</div></div></div>`;
 return `<h1>Наш уголок</h1>
 <div class="room"><div class="stats"><span>🪙 ${S.coins}</span><span>Ур. ${S.lvl}</span><div class="bar"><i style="width:${S.xp}%"></i></div></div>
 ${ps?`<span class="fx">${ps==='feed'?'🍓':ps==='sleep'?'💤':ps==='bath'?'🫧':'💙'}</span>`:''}
 ${pet()}<div class="bubble">${esc(bubble)}</div></div>
 <div class="acts">${ACT.map(x=>`<button onclick="act('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>
 <div class="duo">${pc(a,1)}${pc(b,0)}</div>
 ${b?'':`<div class="card" style="margin-top:12px"><b>Пригласите второго человека</b><p class="muted">Код приглашения:</p><div class="code">${esc(SP.code)}</div><button style="margin-top:10px;background:var(--blue)" onclick="share()">Отправить приглашение</button></div>`}
 <h2>Вопрос дня</h2><div class="card"><b>${q}</b>
 ${my?`<p>Ты: «${esc(my.data.t)}»</p>${th?`<p>${esc(uname(th.created_by))}: «${esc(th.data.t)}»</p>`:'<p class="muted">Ответ второго человека появится здесь.</p>'}`:`<div class="row" style="margin-top:10px"><input id="qa" placeholder="Твой ответ"><button class="fix" onclick="answer()">Ответить</button></div>`}</div>
 <h2>Ближайшее</h2><div class="card">${nx?`<b>${esc(nx.t)}</b> — ${fmt(nx.d)}`:'<span class="muted">Пока ничего не запланировано</span>'}</div>`}
async function mood(){const m=mine();m.mood=MOODS[(MOODS.indexOf(m.mood)+1)%MOODS.length];render();const r=await sb.from('members').update({mood:m.mood}).match({space_id:SP.id,user_id:me.id});if(r.error)fail(r.error)}
function answer(){const v=$('#qa').value.trim();if(!v)return;S.coins+=3;save();addE('answer',{day:today(),t:v})}

function list(k,who){const a=ent(k);return a.length?a.map(x=>`<div class="item ${x.data.d?'done':''}"><button class="chk" aria-label="Отметить" onclick="tog('${x.id}')"></button><span class="t">${esc(x.data.t)}</span>${who?`<button class="av" style="width:34px;height:34px;flex-basis:34px;font-size:13px;background:var(--${col(x.data.w)})" onclick="swho('${x.id}')">${esc(uname(x.data.w)[0])}</button>`:''}<button class="x" aria-label="Удалить" onclick="delE('${x.id}')">✕</button></div>`).join(''):'<p class="muted">Пусто. Добавьте первое.</p>'}
function tog(id){const x=E.find(e=>e.id===id);updE(id,{...x.data,d:x.data.d?0:1})}
function swho(id){const x=E.find(e=>e.id===id),u=MEM.map(m=>m.user_id);updE(id,{...x.data,w:u[(u.indexOf(x.data.w)+1)%u.length]})}
function add(){const v=$('#nw').value.trim();if(v)addE(seg,seg==='todo'?{t:v,w:me.id,d:0}:{t:v,d:0})}
function tasks(){return `<h1>Дела</h1><div class="chips"><button class="${seg==='todo'?'on':''}" onclick="seg='todo';render()">✅ Дела</button><button class="${seg==='shop'?'on':''}" onclick="seg='shop';render()">🛒 Покупки</button></div>
 <div class="card" style="margin-top:10px">${list(seg,seg==='todo')}</div>
 <div class="row" style="margin-top:12px"><input id="nw" placeholder="${seg==='todo'?'Новое дело':'Что купить'}" onkeydown="if(event.key==='Enter')add()"><button class="fix" onclick="add()">Добавить</button></div>`}

function us(){const ev=ent('event').sort((x,y)=>x.data.d>y.data.d?1:-1),me_=ent('memory').slice().reverse();
 return `<h1>Мы</h1><h2 style="margin-top:0">Календарь</h2><div class="card">${ev.length?ev.map(e=>`<div class="item"><span class="t"><b>${esc(e.data.t)}</b><div class="muted">${fmt(e.data.d)}</div></span><button class="x" aria-label="Удалить" onclick="delE('${e.id}')">✕</button></div>`).join(''):'<p class="muted">Добавьте первую важную дату.</p>'}</div>
 <div class="row" style="margin-top:10px"><input id="et" placeholder="Событие"><input id="ed" type="date" class="fix" style="width:150px"><button class="fix" onclick="addEv()">+</button></div>
 <h2>Наши воспоминания</h2>${me_.map(m=>`<div class="card" style="margin-bottom:8px"><div class="row"><span><b>${esc(m.data.t)}</b><div class="muted">${fmt(m.data.d)} · ${esc(uname(m.created_by))}</div></span><button class="x fix" aria-label="Удалить" onclick="delE('${m.id}')">✕</button></div></div>`).join('')}
 <textarea id="mt" rows="2" placeholder="Что хочется сохранить?"></textarea><button style="margin-top:8px;width:100%" onclick="addMem()">Сохранить момент</button>`}
function addEv(){const t=$('#et').value.trim(),d=$('#ed').value;if(t&&d)addE('event',{t,d})}
function addMem(){const t=$('#mt').value.trim();if(t){S.coins+=3;save();addE('memory',{t,d:today()})}}

function equip(i){S.wear=S.wear.filter(w=>SH.find(x=>x.id===w).slot!==i.slot).concat(i.id)}
function buy(id){const i=SH.find(x=>x.id===id);
 if(i.st){note='Демо: оплата звёздами заработает после подключения оплаты. Сейчас предмет выдан бесплатно.';S.own.push(id);equip(i)}
 else if(S.coins>=i.c){S.coins-=i.c;S.own.push(id);equip(i);note=''}
 else note='Не хватает монет. Поиграйте с питомцем, и они появятся 🪙';
 save();render()}
function wear(id){const i=SH.find(x=>x.id===id);S.wear.includes(id)?S.wear=S.wear.filter(x=>x!==id):equip(i);save();render()}
function shop(){return `<h1>Магазин</h1><div class="card" style="text-align:center;padding:4px 0">${pet()}<div class="muted">🪙 ${S.coins} · Ур. ${S.lvl}</div></div>${note?`<p class="bubble">${esc(note)}</p>`:''}
 <div class="duo">${SH.map(i=>{const own=S.own.includes(i.id),on=S.wear.includes(i.id),lock=S.lvl<i.lvl&&!own;return `<div class="card" style="text-align:center"><div style="font-size:34px">${i.e}</div><b>${i.n}</b><div class="muted">${lock?'🔒 Ур. '+i.lvl:own?'Куплено':i.st?'⭐ '+i.st:'🪙 '+i.c}</div><button style="margin-top:8px;width:100%;${on?'background:var(--blue)':''}" ${lock?'disabled':''} onclick="${own?'wear':'buy'}('${i.id}')">${own?(on?'Снять':'Надеть'):'Купить'}</button></div>`}).join('')}</div>`}

function render(){const T=[['home','🏡','Дом'],['tasks','✅','Дела'],['ideas','💡','Идеи'],['shop','🛍️','Магазин'],['us','💞','Мы']];let h;
 if(screen==='load')h='<h1>Загрузка…</h1>';
 else if(screen==='nots')h=`<h1>Наш уголок</h1><div class="card">Откройте приложение через Telegram: бот @${BOT}.</div>`;
 else if(screen==='err')h=`<h1>Не получилось войти</h1><div class="card"><p>${esc(err)}</p><button onclick="location.reload()">Повторить</button></div>`;
 else if(screen==='onb')h=onb();
 else h=({home,tasks,ideas,shop,us}[tab])()+`<nav><div>${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';note='';render();scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div></nav>`;
 $('#app').innerHTML=h}
render();boot();
</script></body></html>
