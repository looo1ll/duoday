  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:true}});
  const a=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});if(a.error)throw a.error;
  me={id:a.data.user.id,name:j.name||''};
  const m=await sb.from('members').select('space_id').eq('user_id',me.id).maybeSingle();if(m.error)throw m.error;

 if(s.error)throw s.error;if(mm.error)throw mm.error;if(e.error)throw e.error;

  const ps=E.filter(x=>x.kind==='memory'&&x.data.p&&!PU[x.data.p]).map(x=>x.data.p);
  if(ps.length){const r=await sb.storage.from('photos').createSignedUrls(ps,21600);(r.data||[]).forEach(u=>{if(u.signedUrl)PU[u.path]=u.signedUrl})}}catch(e){}

const CH=[['close7','7 дней ближе',['Скажите друг другу комплимент','Вспомните первое свидание','Обнимайтесь целую минуту','Проведите вечер без телефонов','Сделайте совместное фото','Приготовьте что-нибудь вместе','Напишите друг другу письмо']],['care7','Неделя заботы',['Принесите партнёру чай или кофе','Спросите «как ты на самом деле?»','Возьмите на себя одно дело партнёра','Сделайте массаж плеч','Оставьте тёплую записку','Приготовьте любимое блюдо партнёра','Устройте вечер, который выберет партнёр']]];
function chTog(c,i){const x=E.find(e=>e.kind==='chal'&&e.data.c===c&&e.data.i===i);x?delNow(x.id):addE('chal',{c,i})}
function chal(){const D=E.filter(x=>x.kind==='chal');return `<h1>Челленджи</h1><p class="muted">Без сроков и давления: отмечайте, когда захочется.</p>`+CH.map(c=>{const n=c[2].filter((_,i)=>D.some(x=>x.data.c===c[0]&&x.data.i===i)).length;return `<div class="card" style="margin-top:10px"><b>${c[1]}</b><div class="muted">${n} из ${c[2].length} выполнено${n===c[2].length?' 🏅 Челлендж пройден!':''}</div><div class="bar" style="margin:8px 0"><i style="width:${Math.round(100*n/c[2].length)}%"></i></div>${c[2].map((t,i)=>{const x=D.find(e=>e.data.c===c[0]&&e.data.i===i);return `<div class="item ${x?'done':''}"><button class="chk" aria-label="Отметить" onclick="chTog('${c[0]}',${i})">${x?'✓':''}</button><span class="t">${t}</span></div>`}).join('')}</div>`}).join('')}


let dw=null,drawing=false,mc=null,sgc='Романтика';
const DW=['Кот','Сердце','Пицца','Море','Самолёт','Дождь','Поцелуй','Зонтик','Дом','Звезда','Кофе','Велосипед','Подарок','Луна','Мороженое'];
const nz=t=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'');
function dPos(e){const c=$('#cv'),r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height]}
function dS(e){e.preventDefault();const c=$('#cv').getContext('2d'),[p,q]=dPos(e);c.lineWidth=5;c.lineCap='round';c.strokeStyle='#22304a';c.beginPath();c.moveTo(p,q);drawing=true}
function dM(e){if(!drawing)return;e.preventDefault();const c=$('#cv').getContext('2d'),[p,q]=dPos(e);c.lineTo(p,q);c.stroke()}
function dE(){drawing=false}
function dClear(){const c=$('#cv');c.getContext('2d').clearRect(0,0,c.width,c.height)}
async function dSend(){const c=$('#cv'),t=document.createElement('canvas');t.width=c.width;t.height=c.height;const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,t.width,t.height);x.drawImage(c,0,0);const w=dw;dw=null;await addE('g_draw',{w,img:t.toDataURL('image/jpeg',.6)})}
function dGuess(id){const v=$('#g'+id).value.trim();if(v)addE('g_dg',{ref:id,t:v})}
function draw(){const o=other();if(!o)return `<h1>Рисуй и угадывай</h1><div class="card">Игра станет доступна, когда подключится второй человек.</div>`;
 const D=E.filter(x=>x.kind==='g_draw'),G=E.filter(x=>x.kind==='g_dg'),gs=id=>G.find(x=>x.data.ref===id),todo=D.filter(x=>x.created_by!==me.id&&!gs(x.id)),done=D.filter(x=>gs(x.id)).reverse(),ok=done.filter(x=>nz(gs(x.id).data.t)===nz(x.data.w)).length;
 return `<h1>Рисуй и угадывай</h1><p class="muted">Нарисуйте слово, а партнёр угадает. Можно в разное время.</p>
 ${todo.map(x=>`<div class="card" style="margin-top:10px"><b>Рисунок от ${esc(uname(x.created_by))}</b><img src="${x.data.img}" alt="Рисунок" style="width:100%;border-radius:18px;margin:8px 0"><div class="row"><input id="g${x.id}" placeholder="Что это?"><button class="fix" onclick="dGuess('${x.id}')">Угадать</button></div></div>`).join('')}
 ${dw!==null?`<div class="card" style="margin-top:10px"><b>Нарисуйте: ${esc(dw)}</b><canvas id="cv" width="300" height="300" style="margin-top:8px" ontouchstart="dS(event)" ontouchmove="dM(event)" ontouchend="dE()" onmousedown="dS(event)" onmousemove="dM(event)" onmouseup="dE()" onmouseleave="dE()"></canvas><div class="row" style="margin-top:8px"><button onclick="dClear()">Очистить</button><button style="background:var(--blue)" onclick="dSend()">Отправить</button></div><button class="x" onclick="dw=null;render()">Отмена</button></div>`:`<button style="width:100%;margin-top:10px;background:var(--blue)" onclick="dw=rnd(DW);render()">🎨 Нарисовать новое слово</button>`}
 ${done.length?`<h2>Результаты (угадано ${ok} из ${done.length})</h2><div class="card">${done.map(x=>{const g=gs(x.id).data.t,r=nz(g)===nz(x.data.w);return `<div class="item"><span class="t"><b>${esc(x.data.w)}</b><div class="muted">${esc(uname(x.created_by))} рисовал(а) · догадка: ${esc(g)} ${r?'✅':'❌'}</div></span></div>`}).join('')}</div>`:''}`}
const SS={'Романтика':['Однажды вечером мы нашли на пороге письмо без подписи…','Это был дождливый вторник, когда всё изменилось…'],'Комедия':['Всё началось с того, что кот решил открыть кофейню…','Мы заказали одну пиццу, а привезли сорок…'],'Фантастика':['В полночь за окном приземлился маленький корабль…','Утром мы проснулись на другой планете…'],'Абсурд':['Холодильник вдруг заговорил с нами голосом старого друга…','В нашем городе пропали все понедельники…']};
function storyAdd(id){const v=$('#sp').value.trim();if(v)addE('g_part',{ref:id,t:v})}
function storyEnd(id){ask('Завершить историю и сохранить её?',()=>addE('g_end',{ref:id}))}
function story(){const o=other();if(!o)return `<h1>Продолжи историю</h1><div class="card">Игра станет доступна, когда подключится второй человек.</div>`;
 const St=E.filter(x=>x.kind==='g_story'),end=new Set(E.filter(x=>x.kind==='g_end').map(x=>x.data.ref)),P=E.filter(x=>x.kind==='g_part'),act=St.filter(x=>!end.has(x.id)).slice(-1)[0],old=St.filter(x=>end.has(x.id)).reverse(),txt=a=>[a.data.t].concat(P.filter(x=>x.data.ref===a.id).map(x=>x.data.t)).join(' ');
 let b;if(!act)b=`<div class="chips">${Object.keys(SS).map(g=>`<button class="${sgc===g?'on':''}" onclick="sgc='${g}';render()">${g}</button>`).join('')}</div><button style="width:100%;margin-top:10px;background:var(--blue)" onclick="addE('g_story',{t:rnd(SS[sgc]),g:sgc})">Начать историю</button>`;
 else{const ps=P.filter(x=>x.data.ref===act.id),last=ps.length?ps[ps.length-1].created_by:act.created_by,mine=last!==me.id;
  b=`<div class="card"><div class="muted">${esc(act.data.g)}</div><p>${esc(txt(act))}</p>${mine?`<textarea id="sp" rows="3" placeholder="Что было дальше?"></textarea><button style="margin-top:8px;width:100%;background:var(--blue)" onclick="storyAdd('${act.id}')">Продолжить</button>`:`<p class="muted">Ждём продолжения от ${esc(o.name)}…</p>`}<button class="x" onclick="storyEnd('${act.id}')">Завершить историю</button></div>`}
 return `<h1>Продолжи историю</h1><p class="muted">Пишите по очереди по одному-два предложения.</p>${b}${old.length?`<h2>Готовые истории</h2>${old.map(x=>`<div class="card" style="margin-bottom:8px"><div class="muted">${esc(x.data.g)}</div>${esc(txt(x))}</div>`).join('')}`:''}`}
const MEJ=['🍓','🌙','🎾','🧸','🌵','🍕','🦋','🍩','🌈','🎈'];
function mNew(){const e=MEJ.slice().sort(()=>Math.random()-.5).slice(0,6);mc={c:e.concat(e).sort(()=>Math.random()-.5).map(v=>({v,o:0,m:0})),f:[],t:0,s:[0,0],lock:false};render()}
function mFlip(i){const g=mc,c=g.c[i];if(g.lock||c.o||c.m)return;c.o=1;g.f.push(i);
 if(g.f.length===2){const[a,b]=g.f.map(k=>g.c[k]);if(a.v===b.v){a.m=b.m=1;g.s[g.t]++;g.f=[]}else{g.lock=true;setTimeout(()=>{a.o=b.o=0;g.f=[];g.t=1-g.t;g.lock=false;render()},900)}}render()}
function memory(){const o=other(),N=[mine().name,o?o.name:'Партнёр'];
 if(!mc)return `<h1>Память</h1><p class="muted">Играйте по очереди на одном телефоне: открывайте по две карточки и ищите пары.</p><button style="width:100%;background:var(--blue)" onclick="mNew()">Начать игру</button>`;
 const done=mc.c.every(x=>x.m),w=mc.s[0]===mc.s[1]?'Ничья 🤝':'Победил(а) '+N[mc.s[0]>mc.s[1]?0:1]+' 🎉';
 return `<h1>Память</h1><div class="row" style="font-weight:800"><span>${esc(N[0])}: ${mc.s[0]}</span><span style="text-align:right">${esc(N[1])}: ${mc.s[1]}</span></div><p class="muted" style="text-align:center">${done?w:'Ходит: '+esc(N[mc.t])}</p>
 <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${mc.c.map((c,i)=>`<button style="font-size:30px;padding:14px 0;${c.m?'background:var(--mint)':''}" aria-label="Карточка" onclick="mFlip(${i})">${c.o||c.m?c.v:'❔'}</button>`).join('')}</div><button style="width:100%;margin-top:12px" onclick="mNew()">Новая игра</button>`}
