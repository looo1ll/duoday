let gm='',wt=15,wres=null,tdm='truth',tdi=null,gk=null;

 return `<div class="row" style="margin-bottom:6px"><button class="fix" onclick="gm='';render()">← Все игры</button></div>`+({wheel,who:()=>duoQ('who'),dil:()=>duoQ('dil'),know,td,ideas,chal}[gm])()}
const WH={5:['Скажите друг другу три добрые вещи','Обнимайтесь 60 секунд','Выберите песню и потанцуйте','Сыграйте раунд «Кто из нас?»','Сделайте смешное селфи'],15:['Приготовьте вместе перекус','Сыграйте в «Выбери одно»','Расскажите друг другу смешной случай из детства','Нарисуйте друг друга за минуту','Составьте список из 5 мест, куда хотите поехать'],30:['Прогулка без телефонов','Домашний спа-вечер','Пересмотрите старые фото','Испеките что-нибудь вместе','Настольная или видеоигра на двоих']};
function spin(){wres=wt?rnd(WH[wt]):rnd(Object.values(ID).flat());render()}
function wheel(){return `<h1>Нам скучно</h1><div class="chips">${[[5,'5 минут'],[15,'15 минут'],[30,'30 минут'],[0,'Весь вечер']].map(x=>`<button class="${wt===x[0]?'on':''}" onclick="wt=${x[0]};wres=null;render()">${x[1]}</button>`).join('')}</div><div class="idea">${wres?esc(wres):'Выберите время и нажмите кнопку'}</div><button style="width:100%;background:var(--blue)" onclick="spin()">🎡 ${wres?'Крутить ещё':'Крутить'}</button>`}
const DQ={who:{t:'Кто из нас?',qs:['Кто чаще опаздывает?','Кто первым напишет после ссоры?','Кто больше тратит?','Кто быстрее заснёт?','Кто любит обниматься?','Кто первым предложит путешествие?','Кто выживет в зомби-апокалипсисе?','Кто чаще теряет вещи?','Кто лучше готовит?','Кто дольше собирается?','Кто громче смеётся над своими шутками?','Кто первым скажет «я скучаю»?']},
dil:{t:'Выбери одно',qs:[['Море','Горы'],['Дом','Путешествие'],['Кино','Прогулка'],['Ужин','Завтрак'],['Спонтанная поездка','Спланированная поездка'],['Утро','Ночь'],['Сладкое','Солёное'],['Лето','Зима'],['Кофе','Чай'],['Поговорить','Обняться молча'],['Подарок','Сюрприз-вечер'],['Город','Природа']]}};
async function gAns(kd,qi,a){if(E.find(x=>x.kind===kd&&x.created_by===me.id&&x.data.day===today()&&x.data.i===qi))return;await addE(kd,{day:today(),i:qi,a:String(a)})}
function duoQ(k){const D=DQ[k],kd='g_'+k,day=today(),o=other();
 if(!o)return `<h1>${D.t}</h1><div class="card">Игра станет доступна, когда подключится второй человек.</div>`;
 const A=E.filter(x=>x.kind===kd),lab=(q,a)=>k==='who'?uname(a):q[+a];
 const rows=[0,1,2].map(j=>{const qi=(dayN()*3+j)%D.qs.length,q=D.qs[qi],mi=A.find(x=>x.created_by===me.id&&x.data.day===day&&x.data.i===qi),ti=A.find(x=>x.created_by!==me.id&&x.data.day===day&&x.data.i===qi),ops=k==='who'?MEM.map(m=>[m.user_id,m.name]):[[0,q[0]],[1,q[1]]];
  const t=k==='who'?q:q[0]+' или '+q[1]+'?';
  const b=!mi?`<div class="row wrap" style="margin-top:10px">${ops.map(x=>`<button onclick="gAns('${kd}',${qi},'${x[0]}')">${esc(x[1])}</button>`).join('')}</div>`
   :ti?`<p>Ты: <b>${esc(lab(q,mi.data.a))}</b><br>${esc(o.name)}: <b>${esc(lab(q,ti.data.a))}</b></p><p>${mi.data.a===ti.data.a?'🎉 Ответы совпали!':'Ответы разные, самое время обсудить 😄'}</p>`
   :`<p>Ты: <b>${esc(lab(q,mi.data.a))}</b></p><p class="muted">Ждём ответ: ${esc(o.name)}.</p>`;
  return `<div class="card" style="margin-top:10px"><b>${esc(t)}</b>${b}</div>`}).join('');
 const g={};A.forEach(x=>(g[x.data.day+'|'+x.data.i]=g[x.data.day+'|'+x.data.i]||[]).push(x));
 const both=Object.values(g).filter(v=>v.length===2&&v[0].created_by!==v[1].created_by),same=both.filter(v=>v[0].data.a===v[1].data.a).length;
 return `<h1>${D.t}</h1><p class="muted">Новые вопросы каждый день. Ответы открываются, когда ответят оба.</p>${rows}<p class="muted" style="text-align:center;margin-top:12px">Совпало: ${same} из ${both.length}</p>`}
const KQ=[['Море или горы?',['Море','Горы','Оба','Ни то ни другое']],['Идеальный вечер?',['Дома с фильмом','Прогулка','Ужин вне дома','Игры']],['Любимая еда?',['Пицца или паста','Азиатская кухня','Домашняя еда','Сладкое']],['Что я замечаю первым?',['Глаза','Улыбку','Одежду','Голос']],['Какой подарок меня обрадует?',['Сделанный руками','Путешествие','Вещь мечты','Совместный вечер']],['Как я лучше всего отдыхаю?',['Сплю','Гуляю','Смотрю сериалы','Играю']]];
async function kAns(i){const qi=gk;gk=null;await addE('g_know',{qi,a:i})}
function kGuess(id,i){addE('g_guess',{ref:id,g:i})}
function know(){const o=other();if(!o)return `<h1>Знаешь меня?</h1><div class="card">Игра станет доступна, когда подключится второй человек.</div>`;
 const K=E.filter(x=>x.kind==='g_know'),G=E.filter(x=>x.kind==='g_guess'),gs=id=>G.find(x=>x.data.ref===id),
 todo=K.filter(x=>x.created_by!==me.id&&!gs(x.id)),done=K.filter(x=>gs(x.id)).reverse(),ok=done.filter(x=>gs(x.id).data.g===x.data.a).length,
 nxt=KQ.findIndex((_,i)=>!K.some(x=>x.created_by===me.id&&x.data.qi===i)),waiting=K.filter(x=>x.created_by===me.id&&!gs(x.id)).length;
 const opts=(q,f)=>q[1].map((t,i)=>`<button style="width:100%;margin-top:6px" onclick="${f(i)}">${t}</button>`).join('');
 return `<h1>Знаешь меня?</h1><p class="muted">Отвечай о себе, а партнёр угадывает. Можно в разное время.</p>
 ${todo.map(x=>{const q=KQ[x.data.qi];return `<div class="card" style="margin-top:10px"><b>${q[0]}</b><p class="muted">Как ответил(а) ${esc(uname(x.created_by))}?</p>${opts(q,i=>`kGuess('${x.id}',${i})`)}</div>`}).join('')}
 ${gk!==null?`<div class="card" style="margin-top:10px"><b>${KQ[gk][0]}</b><p class="muted">Выбери ответ о себе. ${esc(o.name)} попробует угадать.</p>${opts(KQ[gk],i=>`kAns(${i})`)}<button class="x" onclick="gk=null;render()">Отмена</button></div>`
 :nxt>=0?`<button style="width:100%;margin-top:10px;background:var(--blue)" onclick="gk=${nxt};render()">Задать вопрос о себе</button>`:'<p class="muted">Вы ответили на все вопросы. Новые скоро появятся.</p>'}
 ${waiting?`<p class="muted">Ждёт, пока ${esc(o.name)} угадает: ${waiting}</p>`:''}
 ${done.length?`<h2>Результаты (угадано ${ok} из ${done.length})</h2><div class="card">${done.map(x=>{const q=KQ[x.data.qi],g=gs(x.id).data.g;return `<div class="item"><span class="t"><b>${q[0]}</b><div class="muted">${esc(uname(x.created_by))}: ${q[1][x.data.a]} · догадка: ${q[1][g]} ${g===x.data.a?'✅':'❌'}</div></span></div>`}).join('')}</div>`:''}`}
const TD={truth:[['😄','Какая твоя самая смешная привычка?'],['💗','Что тебя во мне покорило сначала?'],['🥰','Какой наш момент ты вспоминаешь с улыбкой?'],['🎭','Какую странную вещь ты делаешь, когда никто не видит?'],['😄','Какая у тебя самая нелепая история из школы?'],['💗','Что ты хотел(а) бы сделать вместе в этом году?'],['🥰','За что ты благодарен(на) мне на этой неделе?'],['🎭','Какое прозвище мне подошло бы больше всего?']],dare:[['😄','Сделайте смешное селфи вдвоём'],['💗','Скажите три вещи, которые любите в партнёре'],['🥰','Смотрите друг другу в глаза 30 секунд'],['🎭','Придумайте друг другу новые прозвища'],['😄','Изобразите свою первую встречу в лицах'],['💗','Обнимитесь на 20 секунд молча'],['🥰','Расскажите историю, которую ещё не рассказывали'],['🎭','Станцуйте любой танец под песню, которую выберет партнёр']]};

const CH=[['close7','7 дней ближе',['Скажите друг другу комплимент','Вспомните первое свидание','Обнимайтесь целую минуту','Проведите вечер без телефонов','Сделайте совместное фото','Приготовьте что-нибудь вместе','Напишите друг другу письмо']],['care7','Неделя заботы',['Принесите партнёру чай или кофе','Спросите «как ты на самом деле?»','Возьмите на себя одно дело партнёра','Сделайте массаж плеч','Оставьте тёплую записку','Приготовьте любимое блюдо партнёра','Устройте вечер, который выберет партнёр']]];
function chTog(c,i){const x=E.find(e=>e.kind==='chal'&&e.data.c===c&&e.data.i===i);x?delNow(x.id):addE('chal',{c,i})}
